name: Build Windows EXE and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create or update (example: v2.0.2)'
        required: true
        type: string
        default: 'v2.0.2'
      prerelease:
        description: 'Mark this release as a prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-network-repair-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, validate and publish Windows EXE
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag and resolve version
        id: release-meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'push') {
              $tag = $env:REF_NAME.Trim()
          } else {
              $tag = $env:INPUT_RELEASE_TAG.Trim()
          }

          $match = [regex]::Match(
              $tag,
              '^v(?<major>0|[1-9]\d*)\.(?<minor>0|[1-9]\d*)\.(?<patch>0|[1-9]\d*)(?<suffix>-[0-9A-Za-z][0-9A-Za-z.-]*)?$'
          )
          if (-not $match.Success) {
              throw "Invalid release tag '$tag'. Use vMAJOR.MINOR.PATCH, for example v2.0.2 or v2.1.0-rc.1."
          }

          # Refuse to silently attach binaries built from one commit to a tag that points elsewhere.
          $existingTag = @(git tag --list $tag)
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect local Git tags.' }
          if ($existingTag -contains $tag) {
              $tagCommit = (git rev-list -n 1 $tag).Trim()
              if ($LASTEXITCODE -ne 0) { throw "Could not resolve existing tag '$tag'." }
              if ($tagCommit -ne $env:SOURCE_SHA) {
                  throw "Tag '$tag' already points to $tagCommit, but this run builds $($env:SOURCE_SHA). Choose a new version tag instead of replacing an old release with binaries from another commit."
              }
          }

          $version = '{0}.{1}.{2}.0' -f $match.Groups['major'].Value,$match.Groups['minor'].Value,$match.Groups['patch'].Value
          $isPrerelease = $match.Groups['suffix'].Success
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:INPUT_PRERELEASE -eq 'true') {
              $isPrerelease = $true
          }

          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "tag=$tag`nversion=$version`nprerelease=$($isPrerelease.ToString().ToLowerInvariant())`n")
          Write-Host "Release tag : $tag"
          Write-Host "File version: $version"
          Write-Host "Prerelease  : $isPrerelease"

      - name: Validate PowerShell source syntax
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -Path . -Recurse -File -Include *.ps1,*.psm1)
          if ($files.Count -eq 0) { throw 'No PowerShell source files were found.' }
          $failed = $false
          foreach ($file in $files) {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors) | Out-Null
              foreach ($parseError in $errors) {
                  Write-Host ("{0}:{1}:{2} {3}" -f $file.FullName,$parseError.Extent.StartLineNumber,$parseError.Extent.StartColumnNumber,$parseError.Message) -ForegroundColor Red
                  $failed = $true
              }
          }
          if ($failed) { throw 'PowerShell syntax validation failed.' }
          Write-Host ("Validated {0} PowerShell source file(s)." -f $files.Count) -ForegroundColor Green

      - name: Setup Node.js for dashboard validation
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate dashboard JavaScript
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --check docs/assets/app.js
          if ($LASTEXITCODE -ne 0) { throw 'Dashboard JavaScript syntax validation failed.' }

      - name: Build standalone Windows executable
        env:
          APP_VERSION: ${{ steps.release-meta.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $distPath = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $buildScript = Join-Path $env:GITHUB_WORKSPACE 'Build/Build-Executable.ps1'

          # A PowerShell script is not a native process. Do not inspect $LASTEXITCODE here:
          # PS2EXE may invoke a native compiler internally and leave that variable non-zero
          # even when the executable was built and verified successfully.
          try {
              & $buildScript -OutputPath $distPath -Version $env:APP_VERSION
          }
          catch {
              throw ('Executable build failed: ' + $_.Exception.Message)
          }

          # The build script throws on failure. Independently verify the deliverable here.
          $exePath = Join-Path $distPath 'WindowsNetworkRepair.exe'
          if (-not (Test-Path -LiteralPath $exePath -PathType Leaf)) {
              throw 'Build script returned without creating WindowsNetworkRepair.exe.'
          }
          $exeInfo = Get-Item -LiteralPath $exePath
          if ($exeInfo.Length -lt 50000) {
              throw ('EXE output is unexpectedly small: {0} bytes.' -f $exeInfo.Length)
          }
          if (Test-Path -LiteralPath ($exePath + '.config')) {
              throw 'A .config sidecar was generated; refusing a non-single-file executable package.'
          }
          Write-Host ('EXE build step verified: {0:N0} bytes.' -f $exeInfo.Length) -ForegroundColor Green

      - name: Prepare source archive, manifest and checksums
        env:
          APP_VERSION: ${{ steps.release-meta.outputs.version }}
          RELEASE_TAG: ${{ steps.release-meta.outputs.tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $distPath = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $prepareScript = Join-Path $env:GITHUB_WORKSPACE 'Build/Prepare-Release.ps1'

          # As above, this is a PowerShell script, not a native executable.
          try {
              & $prepareScript `
                -SourceRoot $env:GITHUB_WORKSPACE `
                -OutputPath $distPath `
                -Version $env:APP_VERSION `
                -Tag $env:RELEASE_TAG `
                -CommitSha $env:COMMIT_SHA
          }
          catch {
              throw ('Release packaging failed: ' + $_.Exception.Message)
          }

          $requiredPackageFiles = @(
              'WindowsNetworkRepair.exe',
              'WindowsNetworkRepair-source.zip',
              'release-manifest.json',
              'SHA256SUMS.txt'
          )
          foreach ($name in $requiredPackageFiles) {
              $path = Join-Path $distPath $name
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw ('Release packaging did not create required file: ' + $name)
              }
              if ((Get-Item -LiteralPath $path).Length -le 0) {
                  throw ('Release packaging created an empty file: ' + $name)
              }
          }

          $manifest = Get-Content -LiteralPath (Join-Path $distPath 'release-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.version -ne $env:APP_VERSION -or $manifest.tag -ne $env:RELEASE_TAG) {
              throw 'Release manifest version/tag does not match the current workflow inputs.'
          }
          Write-Host 'Release package verified. All four files and manifest metadata are valid.' -ForegroundColor Green

      - name: Verify release payload before upload
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
              'WindowsNetworkRepair.exe',
              'WindowsNetworkRepair-source.zip',
              'release-manifest.json',
              'SHA256SUMS.txt'
          )
          foreach ($name in $required) {
              $path = Join-Path (Join-Path $env:GITHUB_WORKSPACE 'dist') $name
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Required release file is missing: $name" }
              if ((Get-Item -LiteralPath $path).Length -le 0) { throw "Required release file is empty: $name" }
          }
          if (Test-Path -LiteralPath (Join-Path (Join-Path $env:GITHUB_WORKSPACE 'dist') 'WindowsNetworkRepair.exe.config')) {
              throw 'An EXE sidecar configuration file was produced; the output is not a single-file package.'
          }
          Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'dist') -File | Format-Table Name,Length -AutoSize

      - name: Upload downloadable workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: WindowsNetworkRepair-${{ steps.release-meta.outputs.tag }}
          path: |
            dist/WindowsNetworkRepair.exe
            dist/WindowsNetworkRepair-source.zip
            dist/release-manifest.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: ${{ steps.release-meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Windows Network Repair Pro ${{ steps.release-meta.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.release-meta.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.release-meta.outputs.prerelease == 'true' && 'false' || 'true' }}
          overwrite_files: true
          fail_on_unmatched_files: true
          preserve_order: true
          files: |
            dist/WindowsNetworkRepair.exe
            dist/WindowsNetworkRepair-source.zip
            dist/release-manifest.json
            dist/SHA256SUMS.txt

      - name: Verify that GitHub Release actually contains every asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-meta.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG"
          $expected = @(
              'WindowsNetworkRepair.exe',
              'WindowsNetworkRepair-source.zip',
              'release-manifest.json',
              'SHA256SUMS.txt'
          )
          $verified = $false
          $lastProblem = 'Release assets were not visible through the GitHub API.'

          for ($attempt = 1; $attempt -le 6; $attempt++) {
              try {
                  $release = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers -TimeoutSec 30
                  $assets = @($release.assets)
                  $assetNames = @($assets | ForEach-Object { [string]$_.name })
                  $missing = @($expected | Where-Object { $_ -notin $assetNames })
                  if ($missing.Count -eq 0) {
                      $exeAsset = $assets | Where-Object { $_.name -eq 'WindowsNetworkRepair.exe' } | Select-Object -First 1
                      if ($null -eq $exeAsset -or [long]$exeAsset.size -lt 50000) {
                          throw 'The EXE asset is missing or unexpectedly small.'
                      }
                      $verified = $true
                      Write-Host "Release verified: $($release.html_url)" -ForegroundColor Green
                      foreach ($asset in $assets) {
                          Write-Host ("  {0} ({1:N0} bytes)" -f $asset.name,[long]$asset.size)
                      }
                      break
                  }
                  $lastProblem = 'Missing release assets: ' + ($missing -join ', ')
              } catch {
                  $lastProblem = $_.Exception.Message
              }
              if ($attempt -lt 6) {
                  Write-Host ("Release verification attempt {0}/6: {1}" -f $attempt,$lastProblem) -ForegroundColor Yellow
                  Start-Sleep -Seconds 3
              }
          }
          if (-not $verified) {
              throw "GitHub Release verification failed. $lastProblem Check the release step logs and repository Actions permissions."
          }
